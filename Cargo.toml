[package]
name = "totp-cli"
version = "0.1.0"
edition = "2024"
description = "A CLI tool for TOTP (Time-based One-Time Password) generation and verification with terminal QR code display"
license = "MIT"
readme = "README.md"
repository = "https://github.com/agb1964/totp-cli"
keywords = ["totp", "2fa", "mfa", "authenticator", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
rstest = "0.27.0"
